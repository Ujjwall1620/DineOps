# ===========================
# Application Configuration
# ===========================
spring.application.name=bill-service
server.port=8085

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3307/Restaurant_Management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#============================
# JPA / Hibernate
#============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# Apache Kafka — Common
# ===========================
spring.kafka.bootstrap-servers=localhost:29092

# ─── Producer ─────────────────────────────────────────────────
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# ─── Consumer ─────────────────────────────────────────────────
spring.kafka.consumer.group-id=bill-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.restaurant.kitchenservice.kafka,com.restaurant.billservice.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# ===========================
# Kafka Topics
# ===========================
# Consumed (from Kitchen Service)
kafka.topic.order-ready=order-ready

# Produced (to Order Service + downstream)
kafka.topic.bill-generated=bill-generated
kafka.topic.payment-completed=payment-completed
kafka.topic.payment-failed=payment-failed

# ===========================
# Billing Configuration
# ===========================
# GST percentage (configurable — no hardcoding)
billing.tax.gst=18

# Service charge percentage — set 0 to disable
billing.service-charge.percentage=5
billing.service-charge.enabled=true

# ===========================
# Payment Gateway
# ===========================
# Active gateway: dummy | razorpay | stripe
payment.gateway=razorpay

# Razorpay TEST credentials
# Get from: https://dashboard.razorpay.com → Settings → API Keys → Test Mode
payment.razorpay.key-id=rzp_test_T5OKHl3p9L0gAA
payment.razorpay.key-secret=HoBNyO3znoCTZa9TKWbbfU8e

# Webhook secret — set in Razorpay Dashboard → Settings → Webhooks
payment.razorpay.webhook-secret=dineops_webhook_secret_2026

# Payment idempotency window in minutes
payment.idempotency.window-minutes=30

# ===========================
# Swagger / OpenAPI
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===========================
# Logging — same pattern as Kitchen Service
# ===========================
logging.level.com.restaurant.billservice=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
