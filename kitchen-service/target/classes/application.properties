# ===========================
# Application Configuration
# ===========================
spring.application.name=kitchen-service
server.port=8084

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3307/Restaurant_Management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# Apache Kafka — Common
# ===========================
spring.kafka.bootstrap-servers=localhost:29092

# ─── Producer ───────────────────────────────────────────────
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Durability: wait for all ISR replicas
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# ─── Consumer ───────────────────────────────────────────────
spring.kafka.consumer.group-id=kitchen-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.restaurant.orderservice.kafka,com.restaurant.kitchenservice.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# ===========================
# Kafka Topics
# ===========================
# Consumed (from Order Service)
kafka.topic.order-created=order-created

# Produced (to Order Service)
kafka.topic.order-ready=order-ready
kafka.topic.order-cooking-started=order-cooking-started

# ===========================
# Logging
# ===========================
logging.level.com.restaurant.kitchenservice=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
