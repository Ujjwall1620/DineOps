# ===========================
# Application Configuration
# ===========================
spring.application.name=menu-service
server.port=8082

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3307/Restaurant_Management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# NOTE: Must match the same secret used by Auth Service and Order Service
# ===========================
jwt.expiration=86400000

# ===========================
# Apache Kafka Configuration
# ===========================
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Topics
kafka.topic.menu-created=menu-created
kafka.topic.menu-updated=menu-updated
kafka.topic.menu-deleted=menu-deleted
kafka.topic.menu-availability-changed=menu-availability-changed

# ===========================
# Logging
# ===========================
logging.level.com.restaurant.menuservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.apache.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
